# Render blueprint: one always-on web service with a small disk for the database.
services:
  - type: web
    name: tour-radar
    runtime: docker
    plan: starter
    healthCheckPath: /healthz
    disk:
      name: radar-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: RADAR_PASSWORD   # the shared sign-in password; Render asks for it on first deploy
        sync: false
      - key: ANTHROPIC_API_KEY   # optional: turns on the AI headline check
        sync: false
