<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tour Radar</title>
<style>
:root{--bg:#f6f4ef;--panel:#fff;--ink:#1c1b19;--muted:#6b675f;--line:#e2ded4;--accent:#b4451f;--accent-ink:#fff;--soft:#f0ece2;
  --s1:#7a6fb0;--s2:#2f7f86;--s3:#b8860b;--s4:#c2571f;--s5:#a8324a;--ok:#2e7d4f}
@media (prefers-color-scheme:dark){:root{--bg:#161513;--panel:#201f1c;--ink:#ece8df;--muted:#a09a8d;--line:#35332e;--accent:#e2733f;--accent-ink:#1a1206;--soft:#2a2824;
  --s1:#a69be0;--s2:#5fb9c0;--s3:#e0b040;--s4:#f08a50;--s5:#e06a82;--ok:#6cc08c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;gap:12px;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
h1{font:600 22px/1 Georgia,"Iowan Old Style",serif;margin:0;letter-spacing:-.01em}
h1 span{color:var(--accent)}
.meta{color:var(--muted);font-size:13px;flex:1;min-width:160px}
button,.btn{font:inherit;font-size:13px;padding:7px 12px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button:hover,.btn:hover{border-color:var(--muted)}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.6;cursor:default}
nav{display:flex;gap:4px;padding:10px 20px 0}
nav button{border:0;background:none;border-bottom:2px solid transparent;border-radius:0;padding:8px 10px;color:var(--muted);font-size:14px}
nav button.on{color:var(--ink);border-color:var(--accent);font-weight:600}
main{padding:16px 20px 60px}
.board{display:grid;grid-template-columns:repeat(5,minmax(210px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--soft);border-radius:10px;padding:10px;min-height:150px}
.col h2{font-size:13px;margin:0;display:flex;align-items:center;gap:7px;text-transform:uppercase;letter-spacing:.05em}
.dot{width:9px;height:9px;border-radius:50%;flex:none}
.col p{margin:3px 0 10px;font-size:12px;color:var(--muted)}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;margin-bottom:8px;cursor:pointer;border-left-width:3px}
.card:hover{border-color:var(--muted)}
.card b{display:block;font-size:15px}
.card .hl{font-size:12.5px;color:var(--muted);margin:4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .win{font-size:12px;font-weight:600}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.tag{font-size:11px;padding:1px 7px;border-radius:99px;background:var(--soft);color:var(--muted);white-space:nowrap}
.tag.new{background:var(--accent);color:var(--accent-ink)}
.tag.local{background:var(--ok);color:#fff}
.empty{font-size:12.5px;color:var(--muted);padding:8px 2px}
section h3{font-size:14px;margin:26px 0 4px}
section>p{margin:0 0 10px;color:var(--muted);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:7px}
.chip{background:var(--panel);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:13px;cursor:pointer}
.chip small{color:var(--accent);font-weight:600;margin-left:4px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;display:flex;gap:12px;align-items:flex-start}
.row .t{flex:1;min-width:0}
.row a{color:var(--ink);font-weight:500;text-decoration:none}
.row a:hover{text-decoration:underline}
.sub{font-size:12px;color:var(--muted);margin-top:2px}
.acts{display:flex;gap:6px;flex:none}
.acts button{padding:4px 9px;font-size:12px}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100vw);background:var(--bg);border-left:1px solid var(--line);box-shadow:-12px 0 40px rgba(0,0,0,.18);overflow-y:auto;padding:20px;transform:translateX(105%);transition:transform .18s;z-index:5}
#drawer.open{transform:none}
#drawer h2{font:600 22px/1.15 Georgia,serif;margin:0 0 4px}
#drawer h4{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:22px 0 8px}
.stagepill{display:inline-block;color:#fff;font-size:12px;font-weight:600;border-radius:99px;padding:2px 10px}
ol.play{margin:0;padding-left:20px}ol.play li{margin-bottom:7px}
.links{display:flex;flex-wrap:wrap;gap:6px}
textarea,input{font:inherit;width:100%;padding:8px 10px;border-radius:7px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
textarea{min-height:230px;font-size:13.5px;line-height:1.5}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 3px}
dialog{border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:min(440px,92vw);padding:20px}
dialog::backdrop{background:rgba(0,0,0,.4)}
dialog h2{margin:0 0 4px;font:600 19px Georgia,serif}
.dlg-acts{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.note{font-size:12.5px;color:var(--muted)}
@media (max-width:700px){header,main,nav{padding-left:16px;padding-right:16px}}
</style>
</head>
<body>
<header>
  <h1>Tour <span>Radar</span></h1>
  <div class="meta" id="meta">Loading…</div>
  <button id="addBtn">+ Track a creator</button>
  <button id="setBtn">Club details</button>
  <button class="primary" id="scanBtn">Scan now</button>
</header>
<nav>
  <button data-tab="pipeline" class="on">Pipeline</button>
  <button data-tab="discovery">Discovery</button>
</nav>
<main id="main"></main>
<aside id="drawer"></aside>

<dialog id="addDlg"><form method="dialog">
  <h2>Track a creator</h2>
  <label>Name (as headlines print it)</label><input id="aName" required>
  <label>Also known as — show or channel names, comma-separated</label><input id="aAlias" placeholder="e.g. Pod Save America">
  <label>YouTube handle (optional)</label><input id="aYt" placeholder="@handle">
  <div class="dlg-acts"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok">Add</button></div>
</form></dialog>

<dialog id="setDlg"><form method="dialog">
  <h2>Club details</h2>
  <div class="note">Used to write pitch drafts and flag headlines that mention your city. Stays on this computer.</div>
  <label>Club name</label><input id="sClub">
  <label>City</label><input id="sCity">
  <label>Room capacity</label><input id="sCap" placeholder="e.g. 250">
  <label>Typical format</label><input id="sFormat" placeholder="e.g. moderated conversation + audience Q&A">
  <label>Your name</label><input id="sContact">
  <label>Reply email</label><input id="sEmail">
  <div class="dlg-acts"><button value="cancel" formnovalidate>Cancel</button><button class="primary" value="ok">Save</button></div>
</form></dialog>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl = u => /^https?:\/\//i.test(u || '') ? u : '#';
const COLORS = {1:'var(--s1)',2:'var(--s2)',3:'var(--s3)',4:'var(--s4)',5:'var(--s5)'};
const COLS = [
  [1,'Whisper','12–24 months out. Agency signings, "working on a book".'],
  [2,'Deal announced','9–18 months out. Get on the publicist\'s list.'],
  [3,'Dated / pre-order','1–6 months out. The pitch window.'],
  [4,'Tour announced','Routing is being set. Ask for an added stop.'],
  [5,'On the road','Appearing now. Gap dates and next leg.'],
];
const PLAY = {
  0:['No live signal yet. Keep them on the watchlist; the radar will move them when something surfaces.','If they are a priority, invite them to a standalone event now — a relationship made before the tour beats a cold pitch during it.'],
  1:['Nothing is public yet, so no one else is pitching. Introduce the club now with a short, no-ask note to their manager or agent.','Find out who represents them (agency signing stories name the agent). Log it in the notes below.','Invite them to a low-stakes event before the project is announced — creators remember the rooms that booked them early.'],
  2:['The deal story names the publisher or studio. Find that imprint\'s publicity contact and ask to be added to the tour-venue list for this title.','Send a one-page venue sheet: capacity, past guests, audience size, ticketing, and how many books you can move.','Publication usually lands 9–18 months after the deal; tour cities get chosen 3–5 months before release. Set a reminder to follow up then.','If it is a campaign rather than a book, contact the campaign scheduler directly — they are booking rooms now.'],
  3:['This is the decision window. Pitch the publicist now with two or three specific dates in the weeks around release.','Offer a ticket-with-book bundle through a local independent bookstore; guaranteed book sales are what gets a city added.','Propose a moderator or conversation partner with their own audience, and mention any livestream or recording you can offer.','Ask whether your city is already on the routing. If a larger venue has it, pitch a second, smaller-format event.'],
  4:['Check the announced dates for a stop near you or an open day between nearby cities, and pitch that exact date.','Contact the tour\'s booking agent or promoter (named in the announcement or ticketing page), not just the publicist.','Offer something the main stop is not: an afternoon civic conversation, a member Q&A, a student or volunteer event.','If your region is skipped, say so in the pitch — "nearest stop is four hours away" is a strong case for an added date.'],
  5:['Move fast: a short email with one concrete date and one clear offer. Tours add stops when early dates sell out.','If they are in town for another event, pitch a same-day or next-morning add-on — travel is already paid for.','Missed this run? The paperback release (about a year after hardcover) or the next leg is a second chance; ask to be on the list.'],
};

let state = null, tab = 'pipeline', openId = null;

async function api(path, body) {
  const r = await fetch(path, body ? {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)} : {});
  if (r.status === 401) { location.reload(); return new Promise(() => {}); }
  return r.json();
}
async function load() { state = await api('/api/state'); render(); if (state.scan.running) setTimeout(load, 1500); }

function ago(iso) {
  const d = Math.round((Date.now() - new Date(iso)) / 864e5);
  return d < 1 ? 'today' : d < 45 ? d + 'd ago' : Math.round(d / 30) + ' mo ago';
}

function render() {
  const sc = state.scan, ls = state.last_scan;
  $('#scanBtn').disabled = sc.running;
  $('#scanBtn').textContent = sc.running ? `Scanning ${sc.done}/${sc.total}…` : 'Scan now';
  $('#meta').textContent = sc.running ? 'Checking ' + (sc.message || '…')
    : ls ? `${state.creators.length} creators tracked · last scan ${ago(ls.finished)} · ${ls.new} new signal${ls.new === 1 ? '' : 's'}${ls.errors && ls.errors.length ? ' · ' + ls.errors.length + ' source error(s)' : ''}${ls.ai ? ' · AI check ' + ls.ai : ''}`
    : 'No scan yet — press Scan now.';
  $('#meta').title = ls && ls.errors ? ls.errors.join('\n') : '';
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === tab));
  $('#main').innerHTML = tab === 'pipeline' ? pipeline() : discovery();
  if (openId) drawer(openId);
}

function card(c) {
  return `<div class="card" style="border-left-color:${COLORS[c.stage]}" data-open="${c.id}">
    <b>${esc(c.name)}</b>
    <div class="hl">${esc(c.lead ? c.lead.title : '')}</div>
    <div class="win" style="color:${COLORS[c.stage]}">${esc(c.window)}</div>
    <div class="tags">${c.new ? `<span class="tag new">${c.new} new</span>` : ''}${c.local ? '<span class="tag local">mentions your city</span>' : ''}
      <span class="tag">${c.signals.filter(s => s.counts).length} signal(s)</span>${c.review ? `<span class="tag">${c.review} to review</span>` : ''}</div>
  </div>`;
}

function pipeline() {
  const cs = state.creators;
  const board = COLS.map(([n, name, sub]) => {
    const list = cs.filter(c => c.stage === n);
    return `<div class="col"><h2><span class="dot" style="background:${COLORS[n]}"></span>${name}</h2><p>${sub}</p>
      ${list.map(card).join('') || '<div class="empty">No one here right now.</div>'}</div>`;
  }).join('');
  const review = cs.filter(c => c.stage === 0 && c.review), quiet = cs.filter(c => c.stage === 0 && !c.review);
  const chip = c => `<span class="chip" data-open="${c.id}">${esc(c.name)}${c.review ? `<small>${c.review}</small>` : ''}</span>`;
  return `<div class="board">${board}</div>
    <section><h3>Needs your eyes</h3><p>Headlines that mention these creators next to a promo signal, but may be about someone else. Open one and confirm or dismiss.</p>
      <div class="chips">${review.map(chip).join('') || '<span class="empty">Nothing waiting.</span>'}</div></section>
    <section><h3>Quiet</h3><p>Tracked, no promo signal in the last year.</p><div class="chips">${quiet.map(chip).join('') || '<span class="empty">Everyone has a signal.</span>'}</div></section>`;
}

function guessName(t) {
  const m = t.replace(/^(youtuber|podcaster|streamer|influencer|twitch streamer|comedian|journalist|author)\s+/i, '').match(/^((?:[A-Z][\w.'’-]+\s){1,2}[A-Z][\w'’-]+)/);
  return m ? m[1].replace(/\s(Signs|Announces|Lands|Inks|To|Is|Will)$/,'') : '';
}

function discovery() {
  const d = state.discovery;
  return `<section><h3 style="margin-top:4px">People not on your watchlist yet</h3>
    <p>Industry headlines about creators signing with agencies, landing book deals or announcing tours. Track the ones that fit the club.</p>
    ${d.map(s => `<div class="row"><div class="t"><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.title)}</a>
      <div class="sub"><span style="color:${COLORS[s.stage]};font-weight:600">${esc(state.stages[s.stage])}</span> · ${esc(s.outlet)} · ${ago(s.published_at)}</div></div>
      <div class="acts"><button data-track="${esc(guessName(s.title))}">Track</button><button data-sig="${s.id}" data-status="dismissed">Hide</button></div></div>`).join('')
      || '<div class="empty">Nothing yet — run a scan.</div>'}</section>`;
}

function pitch(c) {
  const s = state.settings, club = s.club || '[club name]', city = s.city || '[city]';
  const project = c.lead ? `"${c.lead.title}"` : 'the upcoming project';
  const hook = {1:`I know nothing is announced yet — I'm writing early because we'd love to host ${c.name} whenever the next project brings them on the road.`,
    2:`Congratulations on the announcement (${project}). I'd like to put ${club} forward as a ${city} stop when tour planning begins.`,
    3:`With the release coming up (${project}), I'd like to put ${club} forward as the ${city} stop on the tour.`,
    4:`I saw the tour announcement (${project}) and wanted to offer ${club} as an added ${city} date.`,
    5:`I know ${c.name} is on the road right now — if there's an open date near ${city}, we can turn an event around quickly.`}[c.stage] || `We'd love to host ${c.name} at ${club} in ${city}.`;
  return `Subject: ${city} event for ${c.name} — ${club}

Hi [name],

${hook}

${club} is a civic-engagement venue in ${city}${s.capacity ? ` with room for ${s.capacity}` : ''}. Our audience comes to hear people who shape political conversation and to get involved afterward. ${s.format ? 'Our usual format is ' + s.format + '.' : 'Our usual format is a moderated conversation with audience Q&A.'}

What we can offer:
- A promoted, ticketed event with a book or merch bundle sold through a local independent bookstore
- A moderator with their own following, plus recording or livestream if useful
- Flexible dates: [date 1], [date 2] or [date 3]

Is ${city} on the routing yet, and who is the right person to talk dates with?

Thanks,
${s.contact || '[your name]'}
${club}${s.email ? '\n' + s.email : ''}`;
}

function drawer(id) {
  const c = state.creators.find(x => x.id === id);
  if (!c) { closeDrawer(); return; }
  openId = id;
  const g = q => 'https://www.google.com/search?q=' + encodeURIComponent(q);
  const links = [['Publicist', `"${c.name}" publicist OR "publicity contact" OR "press inquiries"`], ['Booking agent', `"${c.name}" "booking" OR "speaking engagements" OR "represented by"`],
    ['Tour dates', `"${c.name}" tour dates tickets`], ['Latest news', `"${c.name}" book OR tour OR announces`]];
  if (c.yt_handle) links.push(['YouTube About (business email)', null, 'https://www.youtube.com/@' + encodeURIComponent(c.yt_handle) + '/about']);
  const sig = s => `<div class="row" style="${s.active && !s.rejected ? '' : 'opacity:.55'}"><div class="t"><a href="${esc(safeUrl(s.url))}" target="_blank" rel="noopener">${esc(s.title)}</a>
    <div class="sub"><span style="color:${COLORS[s.stage]};font-weight:600">${esc(state.stages[s.stage])}</span> · ${esc(s.outlet)} · ${ago(s.published_at)}
      ${s.status === 'confirmed' ? ' · confirmed' : s.ai === 'yes' ? ' · AI checked' : s.ai === 'no' ? ' · AI: not theirs' : s.confidence === 'low' ? ' · unverified' : ''}${s.active ? '' : ' · past cycle'}${s.is_new ? ' · <b>new</b>' : ''}</div>${s.ai_reason ? `<div class="sub">${esc(s.ai_reason)}</div>` : ''}</div>
    <div class="acts">${s.status !== 'confirmed' && (s.confidence === 'low' || s.ai === 'no') ? `<button data-sig="${s.id}" data-status="confirmed">Confirm</button>` : ''}<button data-sig="${s.id}" data-status="dismissed">Dismiss</button></div></div>`;
  $('#drawer').innerHTML = `<div style="display:flex;justify-content:space-between;gap:10px;align-items:flex-start">
      <div><h2>${esc(c.name)}</h2>${c.stage ? `<span class="stagepill" style="background:${COLORS[c.stage]}">${esc(state.stages[c.stage])}</span> <span class="note">${esc(c.window)}</span>` : '<span class="note">No live promo signal</span>'}</div>
      <button id="closeDrawer">Close</button></div>
    <h4>What to do now</h4><ol class="play">${PLAY[c.stage].map(p => `<li>${esc(p)}</li>`).join('')}</ol>
    <h4>Find the right contact</h4><div class="links">${links.map(([l, q, u]) => `<a class="btn" target="_blank" rel="noopener" href="${esc(u || g(q))}">${esc(l)}</a>`).join('')}</div>
    <h4>Signals (${c.signals.length})</h4>${[...c.signals].sort((a, b) => a.rejected - b.rejected).map(sig).join('') || '<div class="empty">None found in the last year.</div>'}
    <h4>Pitch draft</h4><textarea id="pitch">${esc(pitch(c))}</textarea>
    <div style="margin-top:8px"><button id="copyPitch">Copy pitch</button></div>
    <h4>Notes — contacts, replies, follow-up dates</h4><textarea id="notes" style="min-height:90px">${esc(c.notes)}</textarea>
    <div style="margin-top:8px;display:flex;justify-content:space-between"><button id="saveNotes">Save notes</button><button id="removeCreator">Stop tracking</button></div>`;
  $('#drawer').classList.add('open');
}
function closeDrawer() { openId = null; $('#drawer').classList.remove('open'); }

document.addEventListener('click', async e => {
  const t = e.target, o = t.closest('[data-open]');
  if (t.dataset.tab) { tab = t.dataset.tab; render(); }
  else if (t.dataset.sig) { await api('/api/signals', {id:+t.dataset.sig, status:t.dataset.status}); load(); }
  else if (t.dataset.track !== undefined) { $('#aName').value = t.dataset.track; $('#aAlias').value = ''; $('#aYt').value = ''; $('#addDlg').showModal(); }
  else if (o) drawer(+o.dataset.open);
  else if (t.id === 'closeDrawer') closeDrawer();
  else if (t.id === 'copyPitch') { await navigator.clipboard.writeText($('#pitch').value); t.textContent = 'Copied'; }
  else if (t.id === 'saveNotes') { await api('/api/creators/notes', {id:openId, notes:$('#notes').value}); t.textContent = 'Saved'; state.creators.find(c => c.id === openId).notes = $('#notes').value; }
  else if (t.id === 'removeCreator') { if (confirm('Stop tracking and delete their signals?')) { await api('/api/creators/delete', {id:openId}); closeDrawer(); load(); } }
  else if (t.id === 'scanBtn') { await api('/api/scan', {}); setTimeout(load, 400); }
  else if (t.id === 'addBtn') { $('#aName').value = $('#aAlias').value = $('#aYt').value = ''; $('#addDlg').showModal(); }
  else if (t.id === 'setBtn') { const s = state.settings; $('#sClub').value = s.club || ''; $('#sCity').value = s.city || ''; $('#sCap').value = s.capacity || ''; $('#sFormat').value = s.format || ''; $('#sContact').value = s.contact || ''; $('#sEmail').value = s.email || ''; $('#setDlg').showModal(); }
});
$('#addDlg').addEventListener('close', async e => {
  if (e.target.returnValue !== 'ok') return;
  await api('/api/creators', {name:$('#aName').value, aliases:$('#aAlias').value, yt_handle:$('#aYt').value});
  await load(); $('#meta').textContent += ' · added — press Scan now to check them';
});
$('#setDlg').addEventListener('close', async e => {
  if (e.target.returnValue !== 'ok') return;
  await api('/api/settings', {club:$('#sClub').value, city:$('#sCity').value, capacity:$('#sCap').value, format:$('#sFormat').value, contact:$('#sContact').value, email:$('#sEmail').value});
  load();
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeDrawer(); });
load();
</script>
</body>
</html>
